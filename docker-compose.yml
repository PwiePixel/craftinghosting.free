# =============================================================================
#  CraftingHosting.free – Produktions-Setup für eine KVM / VPS
#
#    cp .env.example .env        # Werte anpassen (siehe README)
#    docker compose up -d --build
#
#  Dienste: Migration (einmalig) · API · Worker · Web · Caddy (HTTPS)
#  Datenbank: verschlüsselte SQLite-Datei im Volume "chfree-data" (API und Worker teilen es sich).
#  WICHTIG: DATABASE_ENCRYPTION_KEY in der .env setzen (openssl rand -hex 32) und getrennt sichern –
#  ohne den Schlüssel lässt sich die Datenbank nicht mehr öffnen.
#  Entwicklung mit Mail-Vorschau:  docker compose --profile dev up -d
# =============================================================================

# Logs rotieren (max. 3 × 10 MB je Dienst) – es werden keine Zugriffsprotokolle geschrieben
x-logging: &logging
  driver: json-file
  options: { max-size: '10m', max-file: '3' }

x-api-env: &api-env
  env_file: .env
  environment:
    NODE_ENV: production
    DATABASE_PATH: /data/chfree.db
    DATABASE_ENCRYPTION_KEY: ${DATABASE_ENCRYPTION_KEY:?DATABASE_ENCRYPTION_KEY fehlt (openssl rand -hex 32)}
    PTERODACTYL_MOCK_STATE_FILE: /data/pterodactyl-mock.json
    WEB_INTERNAL_URL: http://web:3000
    RUN_JOBS_IN_API: 'false'
    TZ: UTC

services:
  migrate:
    logging: *logging
    build: { context: ., dockerfile: apps/api/Dockerfile }
    image: craftinghosting-free/api:latest
    <<: *api-env
    command: ['node', 'dist/migrate.js']
    restart: 'no'
    healthcheck: { disable: true }
    volumes:
      - chfree-data:/data

  api:
    logging: *logging
    image: craftinghosting-free/api:latest
    pull_policy: never # wird lokal vom Dienst "migrate" gebaut
    <<: *api-env
    restart: unless-stopped
    volumes:
      - chfree-data:/data
    depends_on:
      migrate: { condition: service_completed_successfully }
    expose: ['4000']

  worker:
    logging: *logging
    image: craftinghosting-free/api:latest
    pull_policy: never # wird lokal vom Dienst "migrate" gebaut
    <<: *api-env
    command: ['node', 'dist/worker.js']
    restart: unless-stopped
    # Gleiches Volume wie die API – beide arbeiten auf derselben Datenbank-Datei
    volumes:
      - chfree-data:/data
    # Der Worker hat keinen HTTP-Port – den HEALTHCHECK des API-Images hier abschalten
    healthcheck: { disable: true }
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    logging: *logging
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://craftinghosting.free}
        NEXT_PUBLIC_PARENT_URL: ${NEXT_PUBLIC_PARENT_URL:-https://crafting.host}
        NEXT_PUBLIC_PARENT_PRICING_URL: ${NEXT_PUBLIC_PARENT_PRICING_URL:-https://crafting.host/pricing}
        NEXT_PUBLIC_DISCORD_URL: ${NEXT_PUBLIC_DISCORD_URL:-}
        NEXT_PUBLIC_STATUS_URL: ${NEXT_PUBLIC_STATUS_URL:-}
        NEXT_PUBLIC_PANEL_URL: ${NEXT_PUBLIC_PANEL_URL:-https://panel.craftinghosting.free}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-chf_session}
      # Geheimer Pfad des Admin-Bereichs (nirgends verlinkt) – in der .env ändern, z. B. /team-7f3k9
      ADMIN_PATH: ${ADMIN_PATH:-/admin}
    depends_on: [api]
    expose: ['3000']

  caddy:
    image: caddy:2-alpine
    logging: *logging
    restart: unless-stopped
    ports: ['80:80', '443:443', '443:443/udp']
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-craftinghosting.free}
    depends_on: [web, api]

  mailpit:
    image: axllent/mailpit:latest
    profiles: ['dev']
    ports: ['8025:8025', '1025:1025']

volumes:
  chfree-data:
  caddy-data:
  caddy-config:
