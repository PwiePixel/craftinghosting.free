# Alternative zu Caddy: nginx (ohne Docker, z. B. mit systemd-Diensten)
# TLS-Zertifikate z. B. per certbot einrichten.

upstream chfree_web { server 127.0.0.1:3000; keepalive 16; }
upstream chfree_api { server 127.0.0.1:4000; keepalive 16; }

server {
    listen 80;
    server_name craftinghosting.free www.craftinghosting.free;
    return 301 https://craftinghosting.free$request_uri;
}

server {
    listen 443 ssl http2;
    # Keine Zugriffsprotokolle (Datenschutzerklärung)
    access_log off;
    server_name craftinghosting.free;

    ssl_certificate     /etc/letsencrypt/live/craftinghosting.free/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/craftinghosting.free/privkey.pem;

    client_max_body_size 1m;

    location /api/ {
        proxy_pass http://chfree_api;
        proxy_set_header Host $host;
        # Nur die echte Adresse des Besuchers – NICHT $proxy_add_x_forwarded_for: Das hängt an, was der Besucher selbst
        # mitschickt, und damit ließe sich die IP (und jede Begrenzung je IP) fälschen.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://chfree_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Nur die echte Adresse des Besuchers – NICHT $proxy_add_x_forwarded_for: Das hängt an, was der Besucher selbst
        # mitschickt, und damit ließe sich die IP (und jede Begrenzung je IP) fälschen.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
